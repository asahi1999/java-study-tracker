# 技カード（設計書 6-5）。教材を作るときに足す。形:
# - id: println        # 英小文字・数字・-。一度決めたら変えない
#   name: println       # カードの名前
#   chapter: 0          # 習う章
#   oneLine: 1行を出して改行する

# 第0章
- id: main
  name: void main()
  chapter: 0
  oneLine: プログラムはここの { } の中から始まる
- id: println
  name: println
  chapter: 0
  oneLine: 1行を出して改行する
- id: print
  name: print
  chapter: 0
  oneLine: 改行せずに出す
- id: string
  name: 文字列
  chapter: 0
  oneLine: '" " で囲んだ文字の並び。中身がそのまま出る'
- id: comment
  name: コメント
  chapter: 0
  oneLine: // から行の終わりまでは実行されない
- id: semicolon
  name: 文と ;
  chapter: 0
  oneLine: 文の終わりに ; を付ける
- id: compile-error
  name: コンパイルエラー
  chapter: 0
  oneLine: 書き方の間違い。行の番号から読む

# 第2章
- id: compare
  name: 比べる記号
  chapter: 2
  oneLine: == や < で比べると true か false になる
- id: if
  name: if 文
  chapter: 2
  oneLine: 条件が true のときだけ動かす。false なら else
- id: else-if
  name: else if
  chapter: 2
  oneLine: 上から見て、最初に true になった1つだけ動く
- id: logic
  name: '&& と ||'
  chapter: 2
  oneLine: 「かつ」「または」で条件をつなぐ
- id: switch
  name: switch 式
  chapter: 2
  oneLine: 値ごとに結果を1つ選ぶ（case 値 -> 結果）
- id: ternary
  name: 三項演算子
  chapter: 2
  oneLine: '条件 ? A : B で2つから選ぶ'
- id: string-equals
  name: equals
  chapter: 2
  oneLine: 文字列が同じかは == ではなく equals で比べる
- id: for
  name: for 文
  chapter: 2
  oneLine: 決まった回数くりかえす
- id: while
  name: while 文
  chapter: 2
  oneLine: 条件が true のあいだくりかえす
- id: nested-loop
  name: 入れ子のループ
  chapter: 2
  oneLine: ループの中のループで、縦と横をくりかえす
- id: break
  name: break
  chapter: 2
  oneLine: ループをすぐ終わる
- id: continue
  name: continue
  chapter: 2
  oneLine: その回の残りを飛ばして、次の回へ進む
